name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Test, package, and publish
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify tag matches the extension version
        shell: pwsh
        run: |
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match manifest version $version."
          }

      - name: Run unit tests and package validation
        run: |
          npm test
          npm run check

      - name: Build release packages
        run: |
          npm run package:release
          npm run package:store

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.zip | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 dist\SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          gh release create $env:GITHUB_REF_NAME dist\otnow-$version.zip dist\otnow-store-$version.zip dist\SHA256SUMS.txt --verify-tag --generate-notes --title "OTNow $version"
