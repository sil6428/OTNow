name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Validate extension
        run: |
          npm run check
          npm run check:firefox

      - name: Build GitHub release package
        run: npm run package:release

      - name: Build Chrome Web Store package
        run: npm run package:store

      - name: Build Firefox package
        run: npm run package:firefox

      - name: Upload validated packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otnow-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
