name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Validate extension
        run: npm run check

      - name: Build GitHub release package
        run: npm run package:release

      - name: Build Chrome Web Store package
        run: npm run package:store

      - name: Upload validated packages
        uses: actions/upload-artifact@v4
        with:
          name: otnow-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
