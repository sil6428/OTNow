<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OTNow sanitized panel</title>
    <link rel="stylesheet" href="../panel/panel.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand" aria-label="OTNow"><span class="brand-mark" aria-hidden="true"><span></span></span><span>OTNow</span></div>
      <div class="top-actions">
        <button class="icon-button" id="refresh" type="button" aria-label="Refresh Canvas deadlines" title="Refresh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M18.2 9A7 7 0 0 0 6.3 6.3L4 8m16 8-2.3 1.7A7 7 0 0 1 5.8 15"/></svg>
        </button>
        <button class="icon-button" id="settings" type="button" aria-label="Open settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1.1 1.6 1.2-2 3.4-1.9-.8-.1.1a8 8 0 0 1-2.1 1.2l-.3.1-.2 2.1h-4l-.3-2.1-.2-.1A8 8 0 0 1 7.8 19l-.1-.1-2 .8-2-3.4 1.7-1.2.1-.1a8 8 0 0 1 0-2.5v-.1l-1.7-1.2 2-3.4 1.9.8.1-.1A8 8 0 0 1 10 7.3l.2-.1.3-2.1h4l.2 2.1.3.1a8 8 0 0 1 2.1 1.2l.1.1 1.9-.8 2 3.4-1.6 1.2-.1.1a8 8 0 0 1 0 2.5Z"/></svg>
        </button>
      </div>
    </header>
    <div id="notice" class="notice" hidden></div>
    <main id="app" aria-live="polite"></main>
    <footer class="footer"><span id="sync-status">Synced just now</span><span class="privacy"><span class="status-dot"></span> Local only</span></footer>
    <script>
      const now = Date.now();
      const iso = (hours) => new Date(now + hours * 60 * 60 * 1000).toISOString();
      const courses = [
        { id: "1", code: "INFR 2600U", name: "Network Security", color: "#2563eb" },
        { id: "2", code: "INFR 4611U", name: "Trust Systems", color: "#7c3aed" },
      ];
      const items = [
        { id: "assignment:1", courseId: "1", courseCode: "INFR 2600U", courseName: "Network Security", color: "#2563eb", title: "Firewall policy analysis", type: "assignment", dueAt: iso(-2), url: "#", status: "open", submitted: false, canvasComplete: false, manuallyComplete: false, moved: null },
        { id: "quiz:2", courseId: "2", courseCode: "INFR 4611U", courseName: "Trust Systems", color: "#7c3aed", title: "Week 3 trust models quiz", type: "quiz", dueAt: iso(6), url: "#", status: "open", submitted: false, canvasComplete: false, manuallyComplete: false, moved: null },
        { id: "discussion:3", courseId: "1", courseCode: "INFR 2600U", courseName: "Network Security", color: "#2563eb", title: "Incident response discussion", type: "discussion", dueAt: iso(27), url: "#", status: "open", submitted: false, canvasComplete: false, manuallyComplete: false, moved: { from: iso(3), at: new Date().toISOString() } },
        { id: "assignment:4", courseId: "2", courseCode: "INFR 4611U", courseName: "Trust Systems", color: "#7c3aed", title: "Designed alliance reflection", type: "assignment", dueAt: iso(72), url: "#", status: "open", submitted: false, canvasComplete: false, manuallyComplete: false, moved: null },
      ];
      window.chrome = {
        runtime: {
          sendMessage: async (message) => message.type === "panel:get" ? {
            state: { status: "ready", items, courses, lastSyncAt: new Date().toISOString(), error: null, errorKind: null, stale: null },
            settings: { theme: "light", showCompleted: false },
          } : { ok: true },
        },
        storage: { onChanged: { addListener: () => {} } },
      };
    </script>
    <script type="module" src="../panel/panel.js"></script>
  </body>
</html>
