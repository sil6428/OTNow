<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OTNow sanitized panel</title>
    <link rel="stylesheet" href="../panel/panel.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand" aria-label="OTNow"><span class="brand-mark" aria-hidden="true"><span></span></span><span>OTNow</span></div>
      <div class="top-actions">
        <button class="icon-button" id="refresh" type="button" aria-label="Refresh Canvas deadlines" title="Refresh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M18.2 9A7 7 0 0 0 6.3 6.3L4 8m16 8-2.3 1.7A7 7 0 0 1 5.8 15"/></svg>
        </button>
        <button class="icon-button theme-button" id="theme-toggle" type="button" aria-label="Use dark theme" title="Toggle dark mode">
          <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z"/></svg>
          <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-button" id="settings" type="button" aria-label="Open settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1.1 1.6 1.2-2 3.4-1.9-.8-.1.1a8 8 0 0 1-2.1 1.2l-.3.1-.2 2.1h-4l-.3-2.1-.2-.1A8 8 0 0 1 7.8 19l-.1-.1-2 .8-2-3.4 1.7-1.2.1-.1a8 8 0 0 1 0-2.5v-.1l-1.7-1.2 2-3.4 1.9.8.1-.1A8 8 0 0 1 10 7.3l.2-.1.3-2.1h4l.2 2.1.3.1a8 8 0 0 1 2.1 1.2l.1.1 1.9-.8 2 3.4-1.6 1.2-.1.1a8 8 0 0 1 0 2.5Z"/></svg>
        </button>
      </div>
    </header>
    <div id="notice" class="notice" hidden></div>
    <main id="app" aria-live="polite"></main>
    <footer class="footer"><span id="sync-status">Synced just now</span><span class="privacy"><span class="status-dot"></span> Local only</span></footer>
    <script>
      const now = Date.now();
      const iso = (hours) => new Date(now + hours * 60 * 60 * 1000).toISOString();
      const courses = [
        { id: "1", code: "TECH 2100", name: "Introduction to Networking", color: "#2563eb" },
        { id: "2", code: "TECH 2200", name: "Information Security", color: "#7c3aed" },
        { id: "3", code: "TECH 2300", name: "Cloud Fundamentals", color: "#0f766e" },
      ];
      const items = [
        { id: "assignment:1", courseId: "1", courseCode: "TECH 2100", courseName: "Introduction to Networking", color: "#2563eb", title: "Network lab report", type: "assignment", dueAt: iso(-2), url: "#", status: "open", submitted: false, canvasComplete: false, manuallyComplete: false, moved: null },
        { id: "quiz:2", courseId: "2", courseCode: "TECH 2200", courseName: "Information Security", color: "#7c3aed", title: "Security concepts quiz", type: "quiz", dueAt: iso(6), url: "#", status: "open", submitted: false, canvasComplete: false, manuallyComplete: false, moved: null },
        { id: "discussion:3", courseId: "1", courseCode: "TECH 2100", courseName: "Introduction to Networking", color: "#2563eb", title: "Team project discussion", type: "discussion", dueAt: iso(27), url: "#", status: "open", submitted: false, canvasComplete: false, manuallyComplete: false, moved: { from: iso(3), at: new Date().toISOString() } },
        { id: "assignment:4", courseId: "3", courseCode: "TECH 2300", courseName: "Cloud Fundamentals", color: "#0f766e", title: "Cloud setup checklist", type: "assignment", dueAt: iso(72), url: "#", status: "open", submitted: false, canvasComplete: false, manuallyComplete: false, moved: null },
      ];
      window.chrome = {
        runtime: {
          sendMessage: async (message) => message.type === "panel:get" ? {
            state: { status: "ready", items, courses, lastSyncAt: new Date().toISOString(), error: null, errorKind: null, stale: null },
            settings: { theme: "light", showCompleted: false },
          } : message.type === "options:set" ? { settings: { theme: message.settings.theme, showCompleted: false } } : { ok: true },
        },
        storage: { onChanged: { addListener: () => {} } },
      };
    </script>
    <script type="module" src="../panel/panel.js"></script>
  </body>
</html>
