<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OTNow promotional tile</title>
    <link rel="stylesheet" href="demo-promo.css">
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="../icons/icon-128.png" alt="">
        <div>
          <p class="name">OTNow</p>
          <p class="tagline">Canvas deadlines,<br>one panel.</p>
        </div>
      </div>
      <div class="panel" aria-hidden="true">
        <span class="panel-title"></span>
        <span class="panel-tab active"></span>
        <span class="panel-tab"></span>
        <span class="deadline wide"></span>
        <span class="deadline"></span>
        <span class="deadline short"></span>
      </div>
    </main>
  </body>
</html>
