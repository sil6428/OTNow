<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OTNow store screenshot</title>
    <link rel="stylesheet" href="demo-host.css">
  </head>
  <body>
    <main class="canvas-demo" aria-label="Sanitized Canvas-style preview">
      <aside class="canvas-nav">
        <div class="canvas-logo">C</div>
        <span class="nav-line wide"></span>
        <span class="nav-line"></span>
        <span class="nav-line wide"></span>
        <span class="nav-line"></span>
        <span class="nav-line wide"></span>
      </aside>
      <section class="canvas-page">
        <header class="canvas-header">
          <div>
            <p>Student dashboard</p>
            <h1>Your courses</h1>
          </div>
          <div class="avatar"></div>
        </header>
        <div class="course-grid">
          <article><div class="cover blue"></div><h2>Introduction to Networking</h2><p>TECH 2100</p></article>
          <article><div class="cover purple"></div><h2>Information Security</h2><p>TECH 2200</p></article>
          <article><div class="cover teal"></div><h2>Cloud Fundamentals</h2><p>TECH 2300</p></article>
        </div>
        <div class="callout">
          <span class="spark"></span>
          <div><strong>Every deadline, one panel.</strong><p>OTNow stays beside Canvas while you work.</p></div>
        </div>
      </section>
    </main>
    <aside class="extension-shell">
      <div class="browser-panel-bar"><span>OTNow</span><span>⋯ &nbsp; ×</span></div>
      <iframe src="demo-panel.html" title="OTNow side panel"></iframe>
    </aside>
  </body>
</html>
